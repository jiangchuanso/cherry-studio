name: Dispatch Docs Update on Release

on:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  dispatch-docs-update:
    runs-on: ubuntu-latest
    steps:
      - name: Get Release Tag from Event
        id: get-event-tag
        shell: bash
        run: |
          # 从当前 Release 事件中获取 tag_name
          echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Check repository dispatch token
        id: check-token
        shell: bash
        env:
          REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$REPO_DISPATCH_TOKEN" ]; then
            echo "::warning::REPO_DISPATCH_TOKEN is not configured; skipping docs update dispatch"
            echo "has-token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch update-download-version workflow to cherry-studio-docs
        if: steps.check-token.outputs.has-token == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: CherryHQ/cherry-studio-docs
          event-type: update-download-version
          client-payload: '{"version": "${{ steps.get-event-tag.outputs.tag }}"}'

name: Desktop Packages
run-name: Desktop packages (${{ github.event.inputs.platform || 'all' }}) @ ${{ github.sha }}

# Standalone copy of the upstream Release workflow's build jobs.
#
# Why it exists: every upstream release workflow is gated behind
# `if: github.repository == 'CherryHQ/cherry-studio'`, so a fork never produces binaries.
# This workflow keeps the same build commands and the same artifact contract but has no
# repository guard, so this repository can actually ship packages.
#
# Artifacts (renamed by scripts/artifact-build-completed.js, validated by
# scripts/release/validate-edition-artifacts.js):
#   * Cherry-Studio-<version>-win-x64-setup.exe / -portable.exe   (windows-latest)
#   * Cherry-Studio-<version>-linux-arm64.deb                      (ubuntu-latest)
#
# Kylin Desktop V10 SP1 is Ubuntu 20.04 based (glibc 2.31). The build job verifies this
# automatically: every shipped ELF must not require a newer glibc, and the deb must ship a
# desktop entry whose declared icon exists under hicolor.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Packages to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - linux
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.edition }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        edition: [global, cn]
        os: ${{ fromJSON(
          github.event.inputs.platform == 'linux' && '["ubuntu-latest"]' ||
          github.event.inputs.platform == 'windows' && '["windows-latest"]' ||
          '["windows-latest", "ubuntu-latest"]'
          ) }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: pnpm ${{ matrix.edition == 'cn' && 'build:win:cn' || 'build:win' }}
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          # Upstream enables Sentry unconditionally; here it is only enabled when the
          # token is configured, otherwise scripts/electron.vite.config.ts throws.
          SENTRY_SOURCE_MAP_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' && 'true' || 'false' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y rpm libevdev-dev libxtst-dev libx11-dev libxfixes-dev libwayland-dev
          pnpm ${{ matrix.edition == 'cn' && 'build:linux:cn' || 'build:linux' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
          SENTRY_SOURCE_MAP_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' && 'true' || 'false' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          MAIN_VITE_CHERRYAI_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRYAI_CLIENT_SECRET }}
          MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET: ${{ secrets.MAIN_VITE_CHERRY_CLOUD_CLIENT_SECRET }}
          MAIN_VITE_MINERU_API_KEY: ${{ secrets.MAIN_VITE_MINERU_API_KEY }}
          RENDERER_VITE_AIHUBMIX_SECRET: ${{ secrets.RENDERER_VITE_AIHUBMIX_SECRET }}
          RENDERER_VITE_PPIO_APP_SECRET: ${{ secrets.RENDERER_VITE_PPIO_APP_SECRET }}

      - name: Validate edition release artifacts
        run: node scripts/release/validate-edition-artifacts.js "${{ matrix.edition }}"

      - name: Verify Kylin V10 SP1 (glibc 2.31) compatibility and desktop icon
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(dist/*-linux-arm64.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::error::No linux arm64 deb was produced"
            exit 1
          fi

          # Kylin Desktop V10 SP1 is Ubuntu 20.04 based, i.e. glibc 2.31.
          MAX_GLIBC=2.31
          status=0

          for deb in "${debs[@]}"; do
            echo "--- $deb"
            dpkg-deb -f "$deb" Package Version Architecture Depends

            workdir="$(mktemp -d)"
            dpkg-deb -x "$deb" "$workdir"

            # 1) architecture must be arm64 (Kylin on Phytium/FeiTeng)
            arch="$(dpkg-deb -f "$deb" Architecture)"
            if [ "$arch" != "arm64" ]; then
              echo "::error::$deb Architecture is '$arch', expected arm64"
              status=1
            fi

            # 2) desktop entry must exist and reference an icon that is actually shipped
            desktop="$(find "$workdir" -name '*.desktop' -print -quit)"
            if [ -z "$desktop" ]; then
              echo "::error::$deb ships no .desktop entry, so it gets no launcher and no icon"
              status=1
            else
              echo "desktop entry: $desktop"
              grep -aE '^(Name|Exec|Icon|StartupWMClass)=' "$desktop" || true
              icon_name="$(sed -n 's/^Icon=//p' "$desktop" | head -1 | tr -d '\r')"
              if [ -z "$icon_name" ]; then
                echo "::error::$deb .desktop has no Icon= entry, the app shows a blank icon"
                status=1
              elif [ -z "$(find "$workdir" -path '*icons/hicolor*' -name "${icon_name}.png" -print -quit)" ]; then
                echo "::error::.desktop declares Icon=$icon_name but no ${icon_name}.png is installed under hicolor"
                status=1
              else
                echo "icon ok: ${icon_name}.png installed under hicolor"
              fi
            fi

            # 3) no shipped ELF may require a glibc newer than the target provides
            mapfile -t elfs < <(find "$workdir" -type f -print0 | xargs -0 -r file | grep -a 'ELF' | cut -d: -f1)
            echo "scanning ${#elfs[@]} ELF files for GLIBC requirements"
            worst="$MAX_GLIBC"
            worst_file=""
            for f in "${elfs[@]}"; do
              # `|| true`: under `set -e`+`pipefail`, a file with no GLIBC version
              # symbols (grep finds nothing → exit 1) or a readelf parse error would
              # otherwise abort the whole check before it prints any result. Skip such
              # files; genuine GLIBC requirements are still captured below.
              need="$(readelf -V "$f" 2>/dev/null | grep -aoE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -1)" || true
              [ -z "$need" ] && continue
              highest="$(printf '%s\n%s\n' "$worst" "$need" | sort -V | tail -1)"
              if [ "$highest" != "$worst" ]; then
                worst="$highest"
                worst_file="$f"
              fi
            done
            echo "highest GLIBC requirement: $worst (from ${worst_file:-none})"
            if [ "$(printf '%s\n%s\n' "$MAX_GLIBC" "$worst" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
              echo "::error::$deb needs GLIBC $worst but Kylin V10 SP1 only has $MAX_GLIBC (offender: $worst_file)"
              status=1
            fi

            # 4) dependencies must be resolvable on Ubuntu 20.04. The runner is Ubuntu 24.04,
            #    which renamed many libraries with a "t64" suffix (libasound2t64, ...). Those
            #    package names do not exist on 20.04 / Kylin V10 SP1, so apt install would fail.
            deps="$(dpkg-deb -f "$deb" Depends || true)"
            t64="$(printf '%s' "$deps" | tr ',' '\n' | grep -aoE '[a-zA-Z0-9.+-]+t64' | sort -u || true)"
            if [ -n "$t64" ]; then
              echo "::error::$deb depends on Ubuntu 24.04-only t64 packages: $t64"
              status=1
            fi

            rm -rf "$workdir"
          done

          if [ "$status" -ne 0 ]; then
            echo "::error::deb is not compatible with Kylin Desktop V10 SP1 (Ubuntu 20.04 / glibc 2.31)"
            exit 1
          fi
          echo "deb is compatible with Kylin Desktop V10 SP1"

      - name: Stage Windows release artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.edition }}
          path: |
            dist/*-win-x64-setup.exe
            dist/*-win-x64-portable.exe
          if-no-files-found: error

      - name: Stage Linux release artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.edition }}
          path: |
            dist/*-linux-arm64.deb
          if-no-files-found: error

  publish:
    name: Attach packages to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      # gh resolves the repository from the git remote, so this job needs a checkout even
      # though it only uploads artifacts. Without it `gh release ...` fails with
      # "failed to run git: fatal: not a git repository".
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: raw-packages

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          # Do not name this directory `packages`: the checkout above restores the repo's own
          # pnpm workspace `packages/` directory, and `gh release create <dir>/*` would then try
          # to upload its subdirectories ("is a directory").
          mkdir -p release-assets
          shopt -s nullglob
          for d in raw-packages/desktop-*; do
            name="$(basename "$d")"
            if [[ "$name" == *-cn ]]; then ed=cn; else ed=global; fi
            for f in "$d"/*-win-x64-setup.exe "$d"/*-win-x64-portable.exe "$d"/*-linux-arm64.deb; do
              base="$(basename "$f")"
              [[ "$ed" == cn ]] && base="cn-${base}"
              cp "$f" "release-assets/${base}"
            done
          done
          echo "Release assets:"
          ls -l release-assets

      - name: Upload packages to the tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Attaching packages to release $TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --generate-notes
          fi
